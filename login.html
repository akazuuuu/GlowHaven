<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="login_register.css">   
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Righteous&display=swap" rel="stylesheet"> 
    <title>Document</title>
</head>
<body>
    <div class="LoginBody">
     <div class="login-container">
        <h1 id="LoginTitle">GlowHaven</h1>
        <div class="login-header">
            <h2>Welcome Back</h2>
            <p>Please sign in to your account</p>
        </div>

        <div class="success-message" id="successMessage">
            Login successful! Welcome back.
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required placeholder="Enter your email">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="Enter your password">
            </div>

           <a href="index.html">
            <button type="submit" class="login-btn">Sign In</button>
</a>

             <div class="forgot-password">
                <a href="#" onclick="showAlert('Password reset link sent to your email!')">Forgot Password?</a>
            </div>

        </form>

        <div class="signup-link">
            <p>Don't have an account? <a href="register.html" onclick="showAlert('Redirecting to sign up page...')">Sign up here</a></p>
        </div>
    </div>
    </div>
</body>
</html>
